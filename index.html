<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FC Tycoon">
<meta name="theme-color" content="#07090d">
<title>FC Tycoon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--a1:#ffc15e;--a2:#ff8a00;--ar:255,153,0;--bg:#07090d;--card:rgba(255,255,255,.05);--card2:rgba(255,255,255,.09);--line:rgba(255,255,255,.08);
--t1:#fff;--t2:rgba(255,255,255,.64);--t3:rgba(255,255,255,.4);--red:#ff453a;--green:#30d158;--blue:#0a84ff;--teal:#2dd4bf;--yel:#ffd60a;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--tab:64px;--top:96px;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--font);overflow:hidden;overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text;font:inherit;font-size:16px;color:var(--t1)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num,b,.st b{font-variant-numeric:tabular-nums}
.grad{background:linear-gradient(135deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.g{color:var(--green)}.r{color:var(--red)}.o{color:var(--a1)}.mut{color:var(--t3)}.t2{color:var(--t2)}

#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.16;animation:drift 26s ease-in-out infinite alternate}
#bg i:nth-child(1){width:360px;height:360px;background:var(--a2);top:-140px;left:-120px}
#bg i:nth-child(2){width:300px;height:300px;background:#1e6bff;top:42%;right:-170px;opacity:.12;animation-duration:32s}
@keyframes drift{to{transform:translate(50px,70px) scale(1.12)}}

/* top HUD */
#top{position:fixed;left:0;right:0;top:0;z-index:6;padding:calc(var(--st) + 8px) 14px 10px;background:rgba(9,11,16,.78);
 backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-bottom:1px solid var(--line)}
.t1{display:flex;align-items:center;justify-content:space-between;gap:10px;height:34px}
#fcBtn{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
#fcBtn b{font-size:17px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:5px;white-space:nowrap}
#fcBtn b svg{width:13px;height:13px;opacity:.5}
#clock{font-size:12.5px;color:var(--t2);font-weight:600;white-space:nowrap}
.spd{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px;flex:none}
.spd button{width:40px;height:30px;border-radius:10px;font-size:13px;font-weight:800;color:var(--t2);display:grid;place-items:center;transition:all .2s}
.spd button svg{width:14px;height:14px}
.spd button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:#111}
.t2r{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px 8px;min-width:0}
.st i{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3)}
.st b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.st b.flash{animation:fl .6s}
@keyframes fl{30%{transform:scale(1.08)}}

/* pages */
#app{position:fixed;inset:0;z-index:1}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + var(--top) + 12px) 14px calc(var(--tab) + var(--sb) + 30px);
 opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
.page.on{opacity:1;pointer-events:auto;transform:none}
.page::-webkit-scrollbar{display:none}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 14px;gap:12px}
.hdr h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hdr .s{font-size:13.5px;color:var(--t2);margin-top:3px}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none;transition:transform .15s}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:19px;height:19px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card h3{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--t3);margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 span{text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;color:var(--t2)}
.lux{background:linear-gradient(160deg,rgba(var(--ar),.15),rgba(255,255,255,.03) 50%,rgba(255,255,255,.04));border-color:rgba(var(--ar),.22)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;font-weight:800;font-size:16.5px;width:100%;
 background:linear-gradient(135deg,var(--a1),var(--a2));color:#111;transition:transform .15s,opacity .2s;box-shadow:0 10px 28px -12px rgba(var(--ar),.6)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card2);color:var(--t1);box-shadow:none}
.btn.danger{background:rgba(255,69,58,.15);color:var(--red);box-shadow:none}
.btn:disabled{opacity:.38}
.btn+.btn{margin-top:10px}
.mb{height:34px;min-width:44px;padding:0 10px;border-radius:11px;background:var(--card2);font-size:14px;font-weight:800;transition:transform .12s,opacity .2s;white-space:nowrap}
.mb:active{transform:scale(.92)}
.mb.p{background:linear-gradient(135deg,var(--a1),var(--a2));color:#111}
.mb.t{background:rgba(45,212,191,.16);color:var(--teal)}
.mb.d{background:rgba(255,69,58,.14);color:#ff7b73}
.mb:disabled{opacity:.3}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:3px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:13px;font-weight:700;color:var(--t2);transition:all .2s;line-height:1.15;padding:3px 2px}
.seg button small{display:block;font-size:10.5px;font-weight:600;opacity:.7}
.seg button.on{background:var(--card2);color:var(--t1);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--a2),var(--a1));transition:width .5s}
.bar i.gr{background:linear-gradient(90deg,#1f9d4a,var(--green))}
.bar i.rd{background:linear-gradient(90deg,#c0281f,var(--red))}
.bar i.tl{background:linear-gradient(90deg,#0f8f80,var(--teal))}
.kv{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;gap:10px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--t2)}
.kv b{font-weight:700;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--card2);color:var(--t2);white-space:nowrap}
.pill.o{background:rgba(var(--ar),.16);color:var(--a1)}
.pill.r{background:rgba(255,69,58,.16);color:#ff7b73}
.pill.g{background:rgba(48,209,88,.15);color:var(--green)}
.pill.t{background:rgba(45,212,191,.15);color:var(--teal)}
.tgl{width:51px;height:31px;border-radius:16px;background:rgba(255,255,255,.16);position:relative;flex:none;transition:background .25s}
.tgl:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tgl.on{background:var(--green)}
.tgl.on:after{transform:translateX(20px)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set div b{display:block;font-size:15.5px;font-weight:700}
.set div small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.35}

/* floor */
#season{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
#season.hot{background:linear-gradient(120deg,rgba(255,69,58,.22),rgba(var(--ar),.14));border-color:rgba(255,120,60,.35)}
#season.warm{background:linear-gradient(120deg,rgba(var(--ar),.16),rgba(255,255,255,.03));border-color:rgba(var(--ar),.25)}
#season.cool{background:linear-gradient(120deg,rgba(10,132,255,.16),rgba(255,255,255,.03));border-color:rgba(10,132,255,.25)}
#season .ic{font-size:24px}
#season b{display:block;font-size:15px;font-weight:800}
#season small{display:block;font-size:12.5px;color:var(--t2);margin-top:1px}
#season .mx{margin-left:auto;font-size:20px;font-weight:900}
.cvw{border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.1);background:#0d1016;position:relative;box-shadow:0 20px 40px -20px rgba(0,0,0,.9)}
#cv{display:block;width:100%}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--t3);margin:9px 0 12px;font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pl{display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pl:first-of-type{border-top:0;padding-top:2px}
.pl .e{font-size:20px;grid-row:span 2;text-align:center}
.pl b{font-size:14.5px;font-weight:700}
.pl .v{font-size:12.5px;color:var(--t2);text-align:right;white-space:nowrap}
.pl .bar{grid-column:2/4}
.pl .q{grid-column:2/4;font-size:12px;color:var(--t3);margin-top:1px}
.tip{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4;color:var(--t2)}
.tip:first-of-type{border-top:0;padding-top:0}
.tip em{font-style:normal;font-size:18px;line-height:1.1}
.tip b{color:var(--t1)}
.news{font-size:13px;line-height:1.4;color:var(--t2);padding:7px 0;border-top:1px solid var(--line);display:flex;gap:10px}
.news:first-of-type{border-top:0;padding-top:0}
.news time{color:var(--t3);font-size:11.5px;font-weight:700;flex:none;width:58px;padding-top:1px}
.news.bad{color:#ffa29c}.news.good{color:#8fe3a9}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4>.btn{margin-top:0}
.mini{background:rgba(255,255,255,.04);border-radius:14px;padding:10px 12px}
.mini i{display:block;font-style:normal;font-size:11px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.mini b{font-size:19px;font-weight:800;display:block;margin-top:2px}

/* team / build */
.dc .top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.dc .top .e{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:23px;flex:none}
.dc .top b{font-size:18px;font-weight:800;display:block}
.dc .top small{font-size:12.5px;color:var(--t2)}
.dc .top .pill{margin-left:auto}
.hr{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.hr .l{flex:1;min-width:0}
.hr .l b{font-size:15px;font-weight:700;display:block}
.hr .l small{font-size:12px;color:var(--t3);display:block;margin-top:1px}
.need{margin-top:6px;font-size:12.5px;color:var(--t2);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.wg{display:flex;align-items:center;gap:10px}
.wg b{font-size:22px;font-weight:800;min-width:74px;text-align:center}
.up{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.up:first-of-type{border-top:0;padding-top:2px}
.up .e{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;font-size:21px;flex:none}
.up .l{flex:1;min-width:0}
.up .l b{display:block;font-size:15px;font-weight:700}
.up .l small{display:block;font-size:12.5px;color:var(--t3);margin-top:2px;line-height:1.35}
.up.own .e{background:rgba(48,209,88,.14)}
.lvl{display:flex;gap:6px;margin:12px 0}
.lvl i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.lvl i.on{background:linear-gradient(90deg,var(--a2),var(--a1))}

/* charts */
.ch{width:100%;height:140px;display:block}
.lg{display:flex;gap:12px;font-size:11.5px;color:var(--t3);font-weight:700;margin-top:6px}
.lg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}

/* goals */
.gl{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.gl:first-of-type{border-top:0;padding-top:2px}
.gl .e{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--card2);flex:none}
.gl.done .e{background:rgba(var(--ar),.2);box-shadow:0 0 0 2px rgba(var(--ar),.5);animation:pulse 1.6s infinite}
.gl.cl .e{background:rgba(48,209,88,.15)}
.gl.cl .l b{color:var(--t2)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(var(--ar),.12)}}
.gl .l{flex:1;min-width:0}
.gl .l b{display:block;font-size:14.5px;font-weight:700;line-height:1.3}
.gl .l small{display:block;font-size:12.5px;color:var(--t3);margin-top:3px}
.gl .bar{margin-top:6px;height:5px}
.cal{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cal:first-of-type{border-top:0;padding-top:0}
.cal .d{width:46px;text-align:center;flex:none;background:var(--card2);border-radius:12px;padding:5px 0}
.cal .d b{display:block;font-size:17px;font-weight:800;line-height:1.1}
.cal .d small{font-size:10.5px;color:var(--t3);font-weight:700;text-transform:uppercase}
.cal .l{flex:1}
.cal .l b{font-size:14.5px;display:block}
.cal .l small{font-size:12.5px;color:var(--t3)}
.badge{position:absolute;top:7px;left:calc(50% + 7px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* tabs */
#tabs{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 8px);height:var(--tab);z-index:5;display:flex;border-radius:24px;
 background:rgba(18,20,26,.78);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);box-shadow:0 20px 40px -12px rgba(0,0,0,.8)}
#tabs button{flex:1;display:grid;justify-items:center;align-content:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--t3);transition:color .2s;position:relative}
#tabs svg{width:24px;height:24px;transition:transform .25s}
#tabs button.on{color:var(--a1)}
#tabs button.on svg{transform:translateY(-1px) scale(1.08)}

/* sheet, modal, toast */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-height:90%;overflow-y:auto;border-radius:28px 28px 0 0;background:#12141a;
 border-top:1px solid rgba(255,255,255,.1);padding:6px 18px calc(var(--sb) + 22px);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.2,1)}
#sheet.on{transform:none}
#sheet.drag{transition:none}
#sheet::-webkit-scrollbar{display:none}
#sheet .card{background:rgba(255,255,255,.04)}
.grab{height:26px;display:grid;place-items:center;margin:0 -18px}
.grab:before{content:"";width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.sh-t{font-size:22px;font-weight:800;margin:2px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 opacity:0;pointer-events:none;transition:opacity .25s}
#modal.on{opacity:1;pointer-events:auto}
.mc{width:100%;max-width:370px;max-height:86vh;overflow-y:auto;background:#14161c;border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:24px 20px 20px;text-align:center;
 transform:scale(.92) translateY(10px);transition:transform .35s cubic-bezier(.2,1.3,.4,1);box-shadow:0 30px 80px -20px rgba(0,0,0,.9)}
#modal.on .mc{transform:none}
.mc .big{font-size:52px;line-height:1;margin-bottom:12px}
.mc h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
.mc p{font-size:15px;color:var(--t2);line-height:1.45;margin-bottom:18px}
.mc .kv{text-align:left}
.mc .btn{margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 14px}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.18);transition:all .3s}
.dots i.on{width:20px;background:var(--a1)}
.flow{display:flex;align-items:center;justify-content:center;gap:4px;margin:4px 0 16px;font-size:12px;font-weight:700;color:var(--t2)}
.flow span{background:var(--card2);border-radius:10px;padding:7px 6px;display:grid;gap:2px;justify-items:center}
.flow span em{font-style:normal;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + var(--tab) + 18px);transform:translate(-50%,60px);opacity:0;pointer-events:none;z-index:15;background:rgba(32,34,40,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 border:1px solid rgba(255,255,255,.12);padding:11px 14px;border-radius:16px;font-size:14px;font-weight:600;display:flex;gap:12px;align-items:center;transition:transform .4s cubic-bezier(.2,1.2,.3,1),opacity .25s;width:max-content;max-width:92%;line-height:1.35}
#toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast.bad{border-color:rgba(255,69,58,.45);background:rgba(52,24,24,.95)}
#toast.good{border-color:rgba(48,209,88,.4);background:rgba(20,44,28,.95)}
#toast button{color:var(--a1);font-weight:800;flex:none}
#dayBan{position:fixed;left:12px;right:12px;top:calc(var(--st) + var(--top) + 8px);z-index:7;border-radius:18px;padding:11px 14px;background:rgba(24,27,34,.95);
 border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transform:translateY(-30px);opacity:0;pointer-events:none;transition:all .4s cubic-bezier(.2,1.1,.3,1);box-shadow:0 16px 30px -10px rgba(0,0,0,.8)}
#dayBan.on{transform:none;opacity:1;pointer-events:auto}
#dayBan .h{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.06em}
#dayBan .b{display:flex;gap:14px;margin-top:5px;font-size:14px;font-weight:700}
#dayBan .b span{color:var(--t3);font-weight:600;font-size:11.5px;display:block}
#fxc{position:fixed;inset:0;z-index:35;pointer-events:none}
#hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}

/* onboarding */

<script>
/* ================= FC TYCOON ENGINE (no DOM) ================= */
const DEPTS=['inb','pick','pack','ship'];
const DN={inb:'Inbound',pick:'Pick',pack:'Pack',ship:'Ship'};
const DI={inb:'🚛',pick:'🛒',pack:'📦',ship:'🚚'};
const RATE={inb:95,pick:60,pack:70,ship:150};
const MACH={inb:{name:'Auto-receive line',add:380,cost:90000,ic:'🏗️'},pick:{name:'Robot drive fleet (10)',add:520,cost:110000,ic:'🤖'},
 pack:{name:'Auto-packer',add:480,cost:120000,ic:'⚙️'},ship:{name:'Smart sorter',add:850,cost:140000,ic:'🔀'}};
const LV=[null,{name:'Small FC',cap:100,store:60000,dem:1,rent:2500,mach:3,dock:16000},
 {name:'Large FC',cap:200,store:130000,dem:1.8,rent:5000,mach:6,dock:30000,cost:600000},
 {name:'Mega FC',cap:420,store:280000,dem:3.4,rent:9500,mach:12,dock:60000,cost:1800000}];
const UPS=[
 ['scan','Faster scanners','Every associate works 10% faster',45000,'📟'],
 ['brk','Break room upgrade','Morale +8, fewer people quit',25000,'☕'],
 ['ac','Air conditioning','No productivity loss in Melbourne summer heat',60000,'❄️'],
 ['safe','Safety program','Incidents drop by 60%',30000,'🦺'],
 ['acad','Training academy','New hires ramp up in 1 day at 70% speed',35000,'🎓'],
 ['maint','Robot maintenance crew','Machine breakdowns drop by 60%',40000,'🔧'],
 ['gen','Backup generator','Power outages no longer stop the floor',30000,'🔋'],
 ['solar','Solar roof','Power bill halved',90000,'☀️'],
 ['mezz','Storage mezzanine','Storage space +60%',150000,'🏬'],
 ['yard','Truck yard expansion','Twice the room for waiting inbound trucks',50000,'🅿️']];
const START=new Date(2026,9,1);
const HW=(()=>{const w=[.35,.25,.2,.2,.25,.4,.6,.8,.95,1.05,1.1,1.15,1.2,1.15,1.1,1.1,1.15,1.25,1.4,1.55,1.6,1.5,1.1,.7];const s=w.reduce((a,b)=>a+b,0);return w.map(x=>x/s)})();
const ON_REV=3.0,LATE_REV=1.5,PACKAGING=.25,MAINT=50;
let G=null;
const E={toast(){},event(){},day(){},over(){},year(){},goal(){}};
const rnd=Math.random;
const qsum=q=>q.reduce((a,c)=>a+c[1],0);
function qmove(from,to,n){let left=n;const out=[];while(left>1e-9&&from.length){const c=from[0];const t=Math.min(c[1],left);c[1]-=t;left-=t;out.push([c[0],t]);if(c[1]<=1e-9)from.shift()}
 if(to)for(const c of out){const l=to[to.length-1];if(l&&l[0]===c[0])l[1]+=c[1];else to.push([c[0],c[1]])}return out}
function dateOf(d){return new Date(START.getFullYear(),START.getMonth(),START.getDate()+d)}
function abs(){return G.day*24+G.hour}
function blankDay(){return{inO:0,ship:0,on:0,late:0,canc:0,rev:0,wage:0,other:0,util:{inb:0,pick:0,pack:0,ship:0},opH:0,quit:0,hired:0,inc:0,turned:0,stockout:0}}
function newGame(){G={v:1,day:0,hour:6,cash:150000,rep:72,morale:72,wage:30,sched:'day',met:false,lv:1,
 D:{inb:{n:9,t:0,tr:[],m:0},pick:{n:11,t:0,tr:[],m:0},pack:{n:10,t:0,tr:[],m:0},ship:{n:5,t:0,tr:[],m:0}},
 up:{},down:{inb:0,pick:0,pack:0,ship:0},mDown:{inb:[],pick:[],pack:[],ship:[]},stock:32000,dock:2500,
 q:{w:[[-10,900],[-6,700],[-2,600]],p:[],k:[]},td:blankDay(),hist:[],tot:{ship:0,on:0,late:0,canc:0,profit:0,hired:0,inc:0},
 goals:{},fx:[],streak:0,debt:0,base:5600,flags:{},lastEv:0,over:false,flow:{inb:0,pick:0,pack:0,ship:0},caps:{inb:0,pick:0,pack:0,ship:0},
 bonusMorale:0,mHist:[],tutorial:0};
 G.dayBase=dayDemand(0);G.inbDaily=inboundPlan();return G}

/* ---------- calendar ---------- */
function blackFriday(y){const d=new Date(y,10,1);let n=0;while(true){if(d.getDay()===4){n++;if(n===4)break}d.setDate(d.getDate()+1)}d.setDate(d.getDate()+1);return d}
function season(dt){const y=dt.getFullYear(),m=dt.getMonth(),d=dt.getDate();const bf=blackFriday(y);const diff=Math.round((dt-bf)/864e5);
 if(diff>=0&&diff<=3)return[4,'Black Friday'];
 if(m===6&&(d===8||d===9))return[3.5,'Prime Day'];
 if(m===6&&d>=1&&d<8)return[1.2,'Prime Day soon'];
 if(m===11&&d===25)return[.3,'Christmas Day'];
 if(m===11&&(d===26||d===27))return[1.9,'Boxing Day'];
 if((m===10&&d>=15)||(m===11&&d<=22))return[2.2,'Peak'];
 if(m===11&&(d===23||d===24))return[1.4,'Last-minute gifts'];
 if(m===10)return[1.3,'Pre-peak'];
 if(m===0&&d<=20)return[.75,'January slump'];
 if(m===5&&d>=20)return[1.3,'EOFY sales'];
 return[1,'']}
const DOWM=[.85,1.12,1.05,1,1,1,.9];
function dayDemand(day){const dt=dateOf(day);return G.base*(1+day*.0012)*season(dt)[0]*DOWM[dt.getDay()]*(.7+G.rep/100*.6)*LV[G.lv].dem*(.93+rnd()*.14)*(G.flags.contract?1.12:1)}
function storeCap(){return LV[G.lv].store*(G.up.mezz?1.6:1)}
function inboundPlan(){let f=0;for(let i=0;i<4;i++){const dt=dateOf(G.day+i);f+=G.base*(1+(G.day+i)*.0012)*season(dt)[0]*(.7+G.rep/100*.6)*LV[G.lv].dem}f/=4;
 const target=f*4.2;let x=f+(target-G.stock-G.dock)/4;return Math.max(0,Math.min(x,storeCap()*.5))}

/* ---------- schedule ---------- */
const SCHED={day:{name:'Day shift',h:10},two:{name:'Two shifts',h:20},'247':{name:'24/7',h:24}};
function isOp(h){const met=G.met?2:0;if(G.sched==='247')return true;const len=SCHED[G.sched].h+met;const rel=(h-6+24)%24;return rel<len}
const isNight=h=>h>=18||h<6;
function opHours(){return Math.min(24,SCHED[G.sched].h+(G.met&&G.sched!=='247'?2:0))}
function fx(k){const a=abs();let m=1;for(const f of G.fx)if(f.k===k&&f.until>a)m*=f.m;return m}
function addFx(k,m,hours){G.fx=G.fx.filter(f=>f.until>abs());G.fx.push({k,m,until:abs()+hours})}
function summer(){const m=dateOf(G.day).getMonth();return m===11||m<=1}
function prod(){return(.75+G.morale/100*.35)*fx('prod')*fx('att')*(G.heat&&!G.up.ac?.85:1)}
function trainees(d){return G.D[d].tr.reduce((a,t)=>a+t.n,0)}
function heads(d){const x=G.D[d];return x.n+trainees(d)+x.t}
function headsAll(){return DEPTS.reduce((a,d)=>a+heads(d),0)}
function machUp(d){const a=abs();return Math.max(0,G.D[d].m-G.mDown[d].filter(u=>u>a).length)}
function cap(d){if(G.down[d]>abs())return 0;const x=G.D[d];const r=RATE[d]*(G.up.scan?1.1:1)*(d==='pick'&&G.flags.slot?1.06:1);
 const ppl=(x.n+trainees(d)*(G.up.acad?.7:.5)+x.t*.85)*r*prod();return ppl+machOut(d,ppl)}
/* machines need people to run them: they can add at most 1.5x what the team does by hand */
function machOut(d,ppl){return Math.min(machUp(d)*MACH[d].add*(G.flags.robo?1.05:1),ppl*1.5)}
function capDay(d){return cap(d)*opHours()}

/* ---------- hourly simulation ---------- */
function tick(){const a=abs(),h=G.hour,td=G.td,op=isOp(h);
 const o=G.dayBase*HW[h]*fx('demand');G.q.w.push([a,o]);td.inO+=o;
 G.dock+=G.inbDaily/24*fx('inbound');const dc=LV[G.lv].dock*(G.up.yard?2:1);if(G.dock>dc){td.turned+=G.dock-dc;G.dock=dc}
 const out=G.outage>a&&!G.up.gen;
 const fl={inb:0,pick:0,pack:0,ship:0};
 if(op&&!out){const c={};DEPTS.forEach(d=>c[d]=cap(d));G.caps=c;
  fl.inb=Math.min(c.inb,G.dock,Math.max(0,storeCap()-G.stock));G.dock-=fl.inb;G.stock+=fl.inb;
  const want=Math.min(c.pick,qsum(G.q.w));fl.pick=Math.min(want,G.stock);if(want-fl.pick>1)td.stockout+=want-fl.pick;qmove(G.q.w,G.q.p,fl.pick);G.stock-=fl.pick;
  fl.pack=Math.min(c.pack,qsum(G.q.p));qmove(G.q.p,G.q.k,fl.pack);
  fl.ship=Math.min(c.ship,qsum(G.q.k));for(const co of qmove(G.q.k,null,fl.ship)){if(a-co[0]<=24)td.on+=co[1];else td.late+=co[1]}
  DEPTS.forEach(d=>{if(c[d]>0)td.util[d]+=Math.min(1,fl[d]/c[d])});td.opH++;
  const nm=isNight(h)?1.25:1;let w=0;DEPTS.forEach(d=>{const x=G.D[d];w+=((x.n+trainees(d))*G.wage+x.t*(G.wage-2))*nm});
  const mc=DEPTS.reduce((s,d)=>s+G.D[d].m,0)*MAINT+fl.ship*PACKAGING;td.wage+=w;td.other+=mc;G.cash-=w+mc;
  /* incidents */
  let ch=.03/opHours();const ut=fl.pick/(c.pick||1);if(ut>.97)ch*=2.2;if(G.morale<40)ch*=2;if(G.met)ch*=1.4;if(G.up.safe)ch*=.4;
  if(rnd()<ch){const d=DEPTS[Math.floor(rnd()*4)];G.down[d]=a+3;G.cash-=8000;td.other+=8000;G.rep=Math.max(0,G.rep-2);G.morale=Math.max(0,G.morale-4);td.inc++;G.tot.inc++;
   E.toast('⚠️ Safety incident in '+DN[d]+'. Area stopped for 3 hours ($8,000)','bad')}}
 else G.caps={inb:0,pick:0,pack:0,ship:0};
 G.flow=fl;
 const rev=0;/* revenue counted at end of day from on/late */
 /* cancellations after 72h */
 while(G.q.w.length&&a-G.q.w[0][0]>72){td.canc+=G.q.w[0][1];G.q.w.shift()}
 G.hour++;if(G.hour===9)maybeEvent();
 if(G.hour===24){G.hour=0;endDay()}}

function endDay(){const td=G.td,dt=dateOf(G.day);
 const rev=td.on*ON_REV+td.late*LATE_REV;G.cash+=rev;td.rev=rev;
 const fixed=LV[G.lv].rent+1500*(G.up.solar?.5:1)+(G.lv-1)*800;G.cash-=fixed;td.other+=fixed;
 const done=td.on+td.late+td.canc;const ot=done>0?td.on/done:1;
 const target=Math.max(0,Math.min(100,(ot-.75)/.25*100));G.rep+=(target-G.rep)*.2;G.rep-=Math.min(8,td.canc/Math.max(1,td.inO)*25);G.rep=Math.max(0,Math.min(100,G.rep));
 /* morale */
 const uts=DEPTS.map(d=>td.opH?td.util[d]/td.opH:0);const avgU=uts.reduce((a,b)=>a+b,0)/4;
 let mt=66+(G.wage-30)*3+(G.up.brk?8:0)-(G.met?13:0)-(G.sched==='247'?5:0)-(avgU>.95?8:avgU<.55?-3:0)-(G.heat&&!G.up.ac?8:0)+G.bonusMorale;
 G.bonusMorale*=.8;G.morale+=(Math.max(5,Math.min(98,mt))-G.morale)*.22;G.morale=Math.max(0,Math.min(100,G.morale));
 G.mHist.push(Math.round(G.morale));if(G.mHist.length>30)G.mHist.shift();
 /* attrition */
 const q=.0015+Math.max(0,55-G.morale)/55*.03+(G.up.brk?0:.001);let quit=0;const qm=fx('quit');
 DEPTS.forEach(d=>{const x=G.D[d];let k=0;for(let i=0;i<x.n;i++)if(rnd()<q*qm)k++;x.n-=k;quit+=k});td.quit=quit;
 if(quit>=3)E.toast(quit+' associates quit yesterday. Check morale and pay','bad');
 /* trainees graduate */
 DEPTS.forEach(d=>{const x=G.D[d];x.tr=x.tr.filter(t=>{if(t.until<=G.day+1){x.n+=t.n;return false}return true})});
 /* machine breakdowns */
 DEPTS.forEach(d=>{for(let i=0;i<G.D[d].m;i++)if(rnd()<(G.up.maint?.015:.04)){G.mDown[d].push(abs()+24+8+Math.floor(rnd()*6));E.toast('🔧 A '+MACH[d].name.replace(/ \(.*\)/,'')+' broke down. Repairs take about 8 hours','bad')}
  G.mDown[d]=G.mDown[d].filter(u=>u>abs()+24)});
 /* history */
 const profit=td.rev-td.wage-td.other;
 G.hist.push({d:G.day,inO:Math.round(td.inO),ship:Math.round(td.on+td.late),ot:Math.round(ot*1000)/10,profit:Math.round(profit),cash:Math.round(G.cash),rep:Math.round(G.rep),mor:Math.round(G.morale),canc:Math.round(td.canc)});
 if(G.hist.length>400)G.hist.shift();
 G.tot.ship+=td.on+td.late;G.tot.on+=td.on;G.tot.late+=td.late;G.tot.canc+=td.canc;G.tot.profit+=profit;
 G.streak=ot>=.95&&td.on+td.late>0?G.streak+1:0;
 const report={date:dt,inO:td.inO,ship:td.on+td.late,ot,profit,canc:td.canc,quit,turned:td.turned,stockout:td.stockout,season:season(dt)[1]};
 /* next day */
 G.day++;const nd=dateOf(G.day);
 if(nd.getMonth()===0&&nd.getDate()===3){let n=0;DEPTS.forEach(d=>{n+=G.D[d].t;G.D[d].t=0});if(n)E.toast('Peak is over: '+n+' temps finished their contracts','')}
 G.heat=summer()&&rnd()<.18;if(G.heat)E.toast('🌡️ Heatwave in Melbourne today'+(G.up.ac?'. Your air conditioning keeps the floor cool':'. Associates slow down by 15%'),G.up.ac?'':'bad');
 G.dayBase=dayDemand(G.day);G.inbDaily=inboundPlan();G.td=blankDay();
 if(G.cash<-250000){G.debt++;if(G.debt===1)E.toast('🏦 You are $250k in debt. Get profitable within 5 days or corporate closes the site','bad');if(G.debt>=5){G.over=true;E.over()}}else G.debt=0;
 if(G.rep<8&&G.day>20){G.over=true;E.over('rep')}
 vpCheck(report);checkGoals();
 E.day(report);
 if(nd.getMonth()===0&&nd.getDate()===1)E.year(nd.getFullYear()-1)}

/* ---------- actions ---------- */
function hire(d,n=1){if(headsAll()+n>LV[G.lv].cap){E.toast('Building is full ('+LV[G.lv].cap+' people). Expand to hire more','bad');return false}
 const c=300*n;G.cash-=c;G.td.other+=c;G.D[d].tr.push({n,until:G.day+(G.up.acad?1:2)});G.td.hired+=n;G.tot.hired+=n;return true}
function fire(d,n=1){const x=G.D[d];let k=Math.min(n,x.n+trainees(d));let r=k;while(r>0&&x.tr.length){const t=x.tr[x.tr.length-1];const m=Math.min(t.n,r);t.n-=m;r-=m;if(!t.n)x.tr.pop()}
 x.n-=r;G.cash-=500*k;G.td.other+=500*k;G.morale=Math.max(0,G.morale-.6*k);return k}
function peakTime(){const m=dateOf(G.day).getMonth();return m>=9&&m<=11||(m===0&&dateOf(G.day).getDate()<3)}
function hireTemp(d,n=5){if(!peakTime()){E.toast('Agencies only supply temps from October to December','bad');return false}
 if(headsAll()+n>LV[G.lv].cap){E.toast('Building is full. Expand to fit more people','bad');return false}G.cash-=120*n;G.td.other+=120*n;G.D[d].t+=n;return true}
function dropTemp(d,n=5){G.D[d].t=Math.max(0,G.D[d].t-n)}

let stRange=30;
function chart(id,sets,o={}){const c=$(id);if(!c)return;const r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);
 const P={l:38,r:6,t:8,b:16};let mn=o.min!=null?o.min:Infinity,mx=o.max!=null?o.max:-Infinity;
 for(const s of sets)for(const v of s.v){if(o.min==null)mn=Math.min(mn,v);if(o.max==null)mx=Math.max(mx,v)}
 if(o.zero){mn=Math.min(mn,0);mx=Math.max(mx,0)}if(!isFinite(mn)){mn=0;mx=1}if(mx-mn<1e-6){mx+=1;mn-=1}
 const pad=(mx-mn)*.08;if(o.max==null)mx+=pad;if(o.min==null&&!o.zero)mn-=pad;
 const W=w-P.l-P.r,H=h-P.t-P.b,Y=v=>P.t+H-(v-mn)/(mx-mn)*H,n=sets[0].v.length;
 x.font='600 10px '+FF;x.fillStyle='rgba(255,255,255,.35)';x.strokeStyle='rgba(255,255,255,.07)';x.lineWidth=1;x.textBaseline='middle';
 for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);x.beginPath();x.moveTo(P.l,y);x.lineTo(w-P.r,y);x.stroke();x.fillText((o.fmt||fk)(v),2,y)}
 if(o.guide!=null){x.strokeStyle='rgba(48,209,88,.5)';x.setLineDash([4,4]);x.beginPath();x.moveTo(P.l,Y(o.guide));x.lineTo(w-P.r,Y(o.guide));x.stroke();x.setLineDash([])}
 if(o.labels){x.textBaseline='alphabetic';x.fillText(o.labels[0],P.l,h-2);const l=o.labels[o.labels.length-1];x.fillText(l,w-P.r-x.measureText(l).width,h-2)}
 for(const s of sets){if(s.type==='bar'){const bw=W/n;s.v.forEach((v,i)=>{x.fillStyle=v>=0?'#30d158':'#ff453a';const y0=Y(0),y1=Y(v);x.fillRect(P.l+i*bw+bw*.15,Math.min(y0,y1),Math.max(1,bw*.7),Math.max(1,Math.abs(y1-y0)))})}
  else{const X=i=>P.l+(n<=1?W/2:i*W/(n-1));x.strokeStyle=s.col;x.lineWidth=2;x.lineJoin='round';x.beginPath();s.v.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();
   if(s.fill){x.lineTo(X(n-1),Y(mn));x.lineTo(X(0),Y(mn));x.closePath();const g=x.createLinearGradient(0,P.t,0,P.t+H);g.addColorStop(0,s.fill);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fill()}
   if(n===1){x.fillStyle=s.col;x.beginPath();x.arc(X(0),Y(s.v[0]),3,0,7);x.fill()}}}}

 '<div class="card"><h3>Season calendar<span>Plan your hiring</span></h3>'+upcoming(8).map(u=>'<div class="cal"><div class="d"><b>'+u.dt.getDate()+'</b><small>'+MON[u.dt.getMonth()]+'</small></div><div class="l"><b>'+(SIC[u.l]||'')+' '+u.l+'</b><small>In '+u.i+' day'+(u.i>1?'s':'')+' · orders ×'+u.m+'</small></div></div>').join('')+'</div>'};
A.claim=el=>{const v=claim(el.dataset.id);if(v){sfx('cash');haptic(2);sparkle(el);confetti(null,null,90);toast('+'+fmF(v)+' reward collected','good')}after()};

/* ================= ACTIONS ================= */
A.hire=el=>{const d=el.dataset.d,n=+el.dataset.n,room=LV[G.lv].cap-headsAll();const k=Math.min(n,room);if(k<=0){E.toast('Building is full ('+LV[G.lv].cap+' people). Expand to hire more','bad');return}
 if(hire(d,k)){sfx('buy');haptic();if(k<n)toast('Only room for '+k+' more people')}after()};
A.fire=el=>{const k=fire(el.dataset.d,1);if(k){sfx('tap');haptic()}after()};
A.temp=el=>{const d=el.dataset.d,room=LV[G.lv].cap-headsAll(),k=Math.min(5,room);if(k<=0){E.toast('Building is full. Expand to fit more people','bad');return}if(hireTemp(d,k)){sfx('buy');haptic()}after()};
A.untemp=el=>{dropTemp(el.dataset.d,5);sfx('tap');haptic();after()};
A.mach=el=>{const d=el.dataset.d;if(buyMach(d)){sfx('buy');haptic(2);sparkle(el);news('Installed a new '+MACH[d].name+' in '+DN[d],'good')}after()};
A.up=el=>{const k=el.dataset.k;if(buyUp(k)){sfx('buy');haptic(2);sparkle(el);const u=UPS.find(x=>x[0]===k);news('Bought '+u[1],'good');toast(u[4]+' '+u[1]+' installed','good')}after()};
A.expand=()=>{const nx=LV[G.lv+1];if(!nx)return;
 modal('<div class="big">🏗️</div><h2>Move to a '+nx.name+'?</h2><p>This costs '+fmF(nx.cost)+'. You keep your team and machines, get more space and slots, and order volume rises to ×'+nx.dem+'. Rent goes up to '+fm(nx.rent)+' a day.</p><button class="btn" id="mY">Expand now</button><button class="btn ghost" id="mN">Not yet</button>',
 m=>{m.querySelector('#mY').onclick=()=>{closeModal();if(expand()){sfx('goal');haptic(2);confetti();news('Expanded to a '+nx.name+'!','good');toast('🏗️ Welcome to your '+nx.name,'good')}after()};m.querySelector('#mN').onclick=closeModal},{dismiss:true})};
A.sched=el=>{G.sched=el.dataset.v;if(G.sched==='247')G.met=false;haptic();sfx('tap');after()};
A.met=()=>{if(G.sched==='247')return;G.met=!G.met;haptic();sfx('tap');after()};
A.wage=el=>{G.wage=clamp(G.wage+ +el.dataset.v,25,45);haptic();sfx('tap');after()};
A.pizza=el=>{const c=pizza();G.cool.pizza=G.day;sfx('cash');haptic();sparkle(el);toast('🍕 Pizza for everyone ('+fmF(c)+')','good');news('Pizza party for the whole site','good');after()};
A.bonus=el=>{const c=bonus();G.cool.bonus=G.day;sfx('cash');haptic(2);confetti(null,null,60);toast('💰 Bonus paid ('+fmF(c)+')','good');news('Cash bonus paid to every associate','good');after()};
A.dept=el=>openDept(el.dataset.d);
function openDept(d){haptic();sfx('tap');openSheet(()=>'<div class="sh-t">'+DI[d]+' '+DN[d]+'<span class="pill">'+fk(G.flow[d])+'/h now</span></div>'+deptCard(d,true)+
 '<div class="card"><h3>What this area does</h3><div style="font-size:13.5px;color:var(--t2);line-height:1.45">'+({inb:'Unloads trucks and puts stock on the shelves. Too slow and pickers run out of stock; trucks pile up in the yard.',
 pick:'Walks the aisles and picks each order into a tote. Orders waiting here for more than 24 hours ship late; after 72 hours they cancel.',
 pack:'Boxes up picked items. Totes pile up on the conveyor if packing is too slow.',ship:'Sorts parcels onto trucks. Anything packed but not shipped still counts as waiting.'})[d]+'</div></div>')}

/* ================= SETTINGS ================= */
A.settings=()=>{if(!G)return;openSheet(Object.assign(()=>'<div class="sh-t">Settings</div>'+
 '<div class="card"><h3>Site name</h3><input class="inp" id="nmI" maxlength="10" value="'+esc(G.name)+'" autocomplete="off" autocapitalize="characters"></div>'+
 '<div class="card">'+[['sound','Sound effects','Clicks, cash and alerts'],['haptics','Haptics','Taps on supported iPhones'],['ffClosed','Fast-forward closed hours','Skip quickly through the night when the floor is shut'],['pauseDay','Pause after each day','Stop the clock at midnight to review the day']]
  .map(r=>'<div class="set"><div><b>'+r[1]+'</b><small>'+r[2]+'</small></div><button class="tgl '+(S[r[0]]?'on':'')+'" data-act="tg" data-k="'+r[0]+'"></button></div>').join('')+'</div>'+
 '<button class="btn ghost" data-act="tut">How to play</button><button class="btn danger" data-act="restart">Start a new FC</button>'+
 '<div style="text-align:center;font-size:12px;color:var(--t3);margin-top:16px">FC Tycoon v1.0 · saves on this device</div>',{static:true}));
 const i=$('nmI');i.oninput=()=>{G.name=(i.value.trim()||'MEL1').toUpperCase().slice(0,10);S.name=G.name;hud();save()}};
A.tg=el=>{const k=el.dataset.k;S[k]=!S[k];el.classList.toggle('on',S[k]);haptic();save()};
A.tut=()=>{closeSheet();setTimeout(tutorial,300)};
A.restart=()=>{closeSheet();modal('<div class="big">🔄</div><h2>Start a new FC?</h2><p>Your current site, cash and progress will be gone for good.</p><button class="btn danger" id="mY">Yes, start over</button><button class="btn ghost" id="mN">Keep playing</button>',
 m=>{m.querySelector('#mY').onclick=()=>{closeModal();resetGame()};m.querySelector('#mN').onclick=closeModal},{dismiss:true})};
function resetGame(){G=null;AG=[];RB=[];T1=[];T2=[];setSpeed(0);save();setTimeout(onboard,260)}

/* ================= ENGINE HOOKS ================= */
let lastReport=null,banT=0;
E.toast=(m,k)=>{toast(m,k);news(m,k);if(k==='bad'){sfx('bad');haptic()}};
E.goal=g=>{sfx('goal');haptic(2);toast('🏆 Goal done: '+g[1],'good','Claim',()=>go('goals'));news('Goal complete: '+g[1],'good')};
E.event=e=>{const sp=e.t.indexOf(' '),ic=e.t.slice(0,sp),ti=e.t.slice(sp+1);sfx('event');haptic(2);
 modal('<div class="big">'+ic+'</div><h2>'+esc(ti)+'</h2><p>'+esc(e.x)+'</p>'+e.c.map((c,i)=>'<button class="btn '+(i?'ghost':'')+'" data-i="'+i+'">'+esc(c[0])+'</button>').join(''),
 m=>m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const res=e.c[+b.dataset.i][1]();G.morale=clamp(G.morale,0,100);G.rep=clamp(G.rep,0,100);news(ti+': '+res);haptic();sfx('tap');
  m.innerHTML='<div class="big">'+ic+'</div><h2>'+esc(ti)+'</h2><p>'+esc(res)+'</p><button class="btn" id="mOk">Back to the floor</button>';m.querySelector('#mOk').onclick=()=>{closeModal();after()}}))};
E.day=r=>{lastReport=r;const b=$('dayBan'),p=r.profit;
 b.innerHTML='<div class="h"><span>'+dstr(r.date)+' wrapped up</span><span>Tap for report</span></div><div class="b"><div><span>Shipped</span>'+fk(r.ship)+'</div><div><span>On time</span><b class="'+(r.ot<.9?'r':r.ot>=.97?'g':'')+'">'+(r.ot*100).toFixed(1)+'%</b></div><div><span>Profit</span><b class="'+(p<0?'r':'g')+'">'+fm(p)+'</b></div>'+(r.canc>1?'<div><span>Cancelled</span><b class="r">'+fk(r.canc)+'</b></div>':'')+'</div>';
 b.classList.add('on');clearTimeout(banT);banT=setTimeout(()=>b.classList.remove('on'),speed>=4?2600:3600);
 if(r.ot<.85)news('Rough day: only '+(r.ot*100).toFixed(1)+'% shipped on time','bad');
 S.best=Math.max(S.best||0,G.day);save();if(tab==='stats')R.stats();if(S.pauseDay&&!G.over){setSpeed(0)}};
A.dayReport=()=>{const r=lastReport;if(!r)return;$('dayBan').classList.remove('on');
 openSheet(Object.assign(()=>'<div class="sh-t">'+dstr(r.date)+'<span class="pill '+(r.season?'o':'')+'">'+(r.season||'Normal day')+'</span></div><div class="card">'+
 [['Orders came in',fn(r.inO)],['Orders shipped',fn(r.ship)],['Shipped on time','<span class="'+(r.ot<.9?'r':'g')+'">'+(r.ot*100).toFixed(1)+'%</span>'],['Cancelled',fn(r.canc)],['People quit',r.quit],
  ['Stock shortfalls (orders)',fn(r.stockout)],['Inbound turned away (units)',fn(r.turned)],['Profit','<span class="'+(r.profit<0?'r':'g')+'">'+fmF(r.profit)+'</span>']]
 .map(k=>'<div class="kv"><span>'+k[0]+'</span><b>'+k[1]+'</b></div>').join('')+'</div><div class="card"><h3>Floor manager</h3>'+tips().map(t=>'<div class="tip"><em>'+t[0]+'</em><div>'+t[1]+'</div></div>').join('')+'</div>',{static:true}))};
E.year=y=>{const H=G.hist.filter(h=>dateOf(h.d).getFullYear()===y);if(!H.length)return;const sh=H.reduce((a,h)=>a+h.ship,0),pr=H.reduce((a,h)=>a+h.profit,0),best=H.reduce((a,h)=>h.ship>a.ship?h:a,H[0]),ot=H.reduce((a,h)=>a+h.ot,0)/H.length;
 setTimeout(()=>{confetti();sfx('goal')},300);
 modal('<div class="big">🎆</div><h2>'+y+' in review</h2><p>Happy New Year from '+esc(G.name)+'! Here is how your site did.</p>'+
 [['Orders shipped',fn(sh)],['Average on time',ot.toFixed(1)+'%'],['Profit',fmF(pr)],['Busiest day',dstr(dateOf(best.d))+' · '+fk(best.ship)],['Rating','★ '+stars().toFixed(1)]].map(k=>'<div class="kv"><span>'+k[0]+'</span><b>'+k[1]+'</b></div>').join('')+
 '<button class="btn" id="mOk">On to '+(y+1)+'</button>',m=>m.querySelector('#mOk').onclick=closeModal)};
E.over=why=>{setTimeout(()=>{setSpeed(0);sfx('over');haptic(3);const T=G.tot;mq.length=0;
 modal('<div class="big">🏚️</div><h2>Corporate closed '+esc(G.name)+'</h2><p>'+(why==='rep'?'Customers stopped trusting the site. Too many orders arrived late or never came.':'The site ran out of money. You stayed more than $250k in debt for 5 days.')+'</p>'+
 [['Days open',G.day],['Orders shipped',fn(T.ship)],['Total profit',fmF(T.profit)],['Best run',(S.best||G.day)+' days']].map(k=>'<div class="kv"><span>'+k[0]+'</span><b>'+k[1]+'</b></div>').join('')+
 '<button class="btn" id="mOk">Open a new FC</button>',m=>m.querySelector('#mOk').onclick=()=>{closeModal();resetGame()});save()},50)};

/* ================= ONBOARDING + TUTORIAL ================= */
function onboard(){if($('ob'))return;const w=document.createElement('div');w.id='ob';const nm=S.name||'MEL1';
 w.innerHTML='<img class="logo" src="icon-192.png" alt=""><h1>FC <span class="grad">Tycoon</span></h1><p>Run your own fulfilment centre. Hire a team, buy robots and survive peak season without the building melting down.</p>'+
 '<label for="obN">Name your site</label><input class="inp" id="obN" maxlength="10" value="'+esc(nm)+'" autocomplete="off" autocapitalize="characters">'+
 '<div class="chips">'+['MEL1','AVV4','SYD8','BWU2','PER2','BNE1'].map(c=>'<button class="chip '+(c===nm?'on':'')+'" data-c="'+c+'">'+c+'</button>').join('')+'</div>'+
 '<button class="btn" id="obGo">Open the doors</button>';
 document.body.appendChild(w);const inp=w.querySelector('#obN');
 w.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{inp.value=c.dataset.c;w.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));haptic();sfx('tap')});
 w.querySelector('#obGo').onclick=()=>{const n=(inp.value.trim()||'MEL1').toUpperCase().slice(0,10);S.name=n;newGame();fillG();G.name=n;G.news=[];
  news('Welcome to '+n+'! Your first shift starts at 06:00','good');save();w.classList.add('out');setTimeout(()=>w.remove(),460);sfx('goal');haptic(2);hud();R.floor();if(tab!=='floor')go('floor');
  setSpeed(0);setTimeout(()=>{if(!S.tut)tutorial();else setSpeed(1)},350)}}
const TUT=[
 ['🏭','Welcome, site leader','Orders come in all day. Your job is to ship each one within 24 hours. Late orders earn half, and after 72 hours they cancel and hurt your rating.'],
 ['🔁','Every order takes the same path','<span class="flow"><span><em>🚛</em>Inbound</span>›<span><em>🛒</em>Pick</span>›<span><em>📦</em>Pack</span>›<span><em>🚚</em>Ship</span></span>The slowest area is your bottleneck. The floor manager tips tell you where it is.'],
 ['👷','People and robots','Hire associates (they train for 2 days), add temps from October to December, and buy machines to boost each area. Machines still need people to run them.'],
 ['📅','Watch the calendar','Peak runs from mid November to Christmas. Black Friday brings 4× the orders and Prime Day hits in July. Hire before the rush, not during it.'],
 ['😊','Look after your team','Low morale means slower work, more quits and more injuries. Pay, breaks, shifts and extra time all change how people feel.'],
 ['⏩','You are in charge','Use pause, 1×, 2× and 4× at the top. Tap any area of the floor to manage it. The game saves itself on this phone.']];
function tutorial(){let i=0;const prev=speed;setSpeed(0);
 const draw=m=>{const t=TUT[i];m.innerHTML='<div class="big">'+t[0]+'</div><div class="dots">'+TUT.map((x,j)=>'<i class="'+(j===i?'on':'')+'"></i>').join('')+'</div><h2>'+t[1]+'</h2><p>'+t[2]+'</p>'+
  '<button class="btn" id="tN">'+(i===TUT.length-1?'Start the clock':'Next')+'</button>'+(i?'<button class="btn ghost" id="tB">Back</button>':'<button class="btn ghost" id="tS">Skip</button>');
  m.querySelector('#tN').onclick=()=>{haptic();sfx('tap');if(i<TUT.length-1){i++;draw(m)}else done()};
  const b=m.querySelector('#tB');if(b)b.onclick=()=>{i--;draw(m)};const s=m.querySelector('#tS');if(s)s.onclick=done};
 const done=()=>{S.tut=true;save();closeModal();setTimeout(()=>setSpeed(prev||S.speed||1),260)};
 modal('',draw)}

/* ================= BOOT ================= */
window.addEventListener('error',e=>{(window.__e=window.__e||[]).push(String(e.message))});
load();setSpeed(0);
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop)});
if(G){hud();R.floor();setSpeed(S.speed||1)}else onboard();
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
